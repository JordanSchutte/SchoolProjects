<h2>Edit Trip</h2>
<form [formGroup]="editForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="code">Code:</label>
    <input id="code" type="text" formControlName="code">
  </div>
  <div>
    <label for="name">Name:</label>
    <input id="name" type="text" formControlName="name">
  </div>
  <div>
    <label for="length">Length:</label>
    <input id="length" type="text" formControlName="length">
  </div>
  <div>
    <label for="start">Start Date:</label>
    <input id="start" type="date" formControlName="start">
  </div>
  <div>
    <label for="resort">Resort:</label>
    <input id="resort" type="text" formControlName="resort">
  </div>
  <div>
    <label for="perPerson">Price Per Person:</label>
    <input id="perPerson" type="text" formControlName="perPerson">
  </div>
  <div>
    <label for="image">Image:</label>
    <input id="image" type="text" formControlName="image">
  </div>
  <div>
    <label for="description">Description:</label>
    <textarea id="description" formControlName="description"></textarea>
  </div>
  <button type="submit" [disabled]="!editForm.valid">Update Trip</button>
</form>
